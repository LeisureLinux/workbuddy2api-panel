name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀（wb2api-panel-v1.2.3-... 既有惯例）
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 仅 tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）→ 汇总资产 → 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SRC="${SRC%-panel}"   # appVersion 带 -panel 后缀，比对前剥掉
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 取源码版本号
        id: ver
        # publish job 与 build job 是两个独立 job，steps 不共享——必须自己取一遍
        # （否则正文里的版本号会是空的）。
        # 另：appVersion 带 -panel 后缀，而**文件名不带**（build job 打包时用
        # V="${V%-panel}" 剥掉了）——正文里的文件名要跟实际产物一致，故两版都输出。
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          echo "v=${SRC%-panel}" >> "$GITHUB_OUTPUT"   # 文件名口径：1.13.5
          echo "vfull=$SRC" >> "$GITHUB_OUTPUT"        # 完整口径：1.13.5-panel
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}-panel
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布。

            ## 产物清单

            **五平台静态二进制**（`wb2api` 主程序 + `config.example.json` + `README.md`）：

            | 文件 | 平台 |
            |---|---|
            | `wb2api-panel-v${{ steps.ver.outputs.v }}-linux-amd64.tar.gz` | Linux x86_64 |
            | `wb2api-panel-v${{ steps.ver.outputs.v }}-linux-arm64.tar.gz` | Linux aarch64 |
            | `wb2api-panel-v${{ steps.ver.outputs.v }}-darwin-amd64.tar.gz` | macOS Intel |
            | `wb2api-panel-v${{ steps.ver.outputs.v }}-darwin-arm64.tar.gz` | macOS Apple Silicon |
            | `wb2api-panel-v${{ steps.ver.outputs.v }}-windows-amd64.zip` | Windows x64 |

            **两个架构的 `.deb` 包**（Debian / Ubuntu，含 **4 个** 可执行文件与 systemd unit）：

            | 文件 | 架构 | 内含 |
            |---|---|---|
            | `workbuddy2api-panel_${{ steps.ver.outputs.v }}_amd64.deb` | amd64 | `wb2api` / `wb2api-signin` / `wb2api-login` / `wb2api-credit` |
            | `workbuddy2api-panel_${{ steps.ver.outputs.v }}_arm64.deb` | arm64 | 同上 |

            `.deb` 安装后会自动创建 `workbuddy2api` 系统用户、落默认配置到
            `/etc/workbuddy2api/config.json`，并 enable + start `workbuddy2api.service`
            （unit 装在 `/usr/lib/systemd/system/`，数据在 `/var/lib/workbuddy2api/`，
            监听 `:7863`）。

            另有 `checksums.txt`（`sha256sum -c checksums.txt` 可校验）与
            GHCR 多架构镜像（`ghcr.io/linguo2625469/workbuddy2api-panel`）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
