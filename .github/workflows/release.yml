name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build static binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build/bin
          for spec in "server:wb2api" "signin:wb2api-signin" "login:wb2api-login" "credit:wb2api-credit"; do
            IFS=: read -r dir out <<< "$spec"
            echo "building $out (${{ matrix.goarch }})"
            go build -trimpath -ldflags="-s -w" -o "build/bin/$out" "./cmd/$dir"
          done
          ls -lh build/bin

      - name: Strip binaries
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get update
            sudo apt-get install -y binutils-aarch64-linux-gnu
            for f in build/bin/*; do aarch64-linux-gnu-strip "$f"; done
          else
            for f in build/bin/*; do strip "$f"; done
          fi
          file build/bin/*

      - name: Package .deb
        run: |
          PKG="workbuddy2api-panel"
          ROOT="debroot"
          rm -rf "$ROOT"
          # unit 装到 /usr/lib/systemd/system（**不是** /etc/systemd/system）：
          #   - /usr/lib/systemd/system = 发行版/软件包提供的 unit（vendor 区）；
          #   - /etc/systemd/system = 本机管理员自定义/覆盖 unit（admin 区）。
          # 打包方提供的 unit 属前者；放 /etc 会让本机一改 unit 就被包升级覆盖，
          # 且 dpkg 升级时无法与「本机改过」的文件正常协商。
          #   - 装 /usr/lib 而非 /lib：Debian 13 起 /lib 是 /usr/lib 的软链（合并 usr），
          #     新包一律写 /usr/lib；dpkg 1.22 会把 /usr/lib 自动重定向记录为 /lib，
          #     两种写法都能落到位，但 /usr/lib 是当前规范。
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/man/man1" "$ROOT/usr/share/doc/$PKG" "$ROOT/usr/lib/systemd/system"
          cp build/bin/* "$ROOT/usr/bin/"
          chmod 0755 "$ROOT/usr/bin/"*
          cp packaging/systemd/workbuddy2api.service "$ROOT/usr/lib/systemd/system/"
          cp packaging/debian/postinst "$ROOT/DEBIAN/postinst"
          cp packaging/debian/prerm "$ROOT/DEBIAN/prerm"
          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"
          gzip -9c man/wb2api.1 > "$ROOT/usr/share/man/man1/wb2api.1.gz"
          cp config.example.json "$ROOT/usr/share/doc/$PKG/config.example.json"
          cat > "$ROOT/DEBIAN/control" <<CTRL
          Package: $PKG
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: LeisureLinux <leisurelinux@example.com>
          Description: WorkBuddy (CodeBuddy) OpenAI-compatible multi-account gateway + web panel
           Static single-binary gateway exposing /v1/chat/completions for multiple
           WorkBuddy/CodeBuddy accounts, with a web management panel, account pool
           rotation, cooldown/circuit breaker, sticky sessions and scheduled tasks.
          CTRL
          sed -i 's/^          //' "$ROOT/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$ROOT" "${PKG}_${VERSION}_${{ matrix.arch }}.deb"
          ls -lh "${PKG}_${VERSION}_${{ matrix.arch }}.deb"

      - name: Create GitHub release if needed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release 的 **body 由 go-binaries.yml 写**（它才是“五平台二进制”的产出方，
          # 且写得最全）。本 workflow 只负责“建 release（若不存在）”与传 .deb：
          #   - `gh release create` 不带 --generate-notes：它会写一份自动生成的
          #     变更说明，与 go-binaries.yml 的 body 抢同一个字段（两个 workflow
          #     并行跑，谁后结束谁赢 → 正文随机变成“自动生成说明”或“五平台二进制”）。
          #     这里不写 body，等 go-binaries.yml 用 softprops 写。
          #   - 若本 workflow 先建出 release，softprops 仍会**覆盖** body（它的
          #     默认行为就是 update），所以先建后写是安全的。
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"

      - name: Upload .deb to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "workbuddy2api-panel_${VERSION}_${{ matrix.arch }}.deb" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy2api-panel-${{ matrix.arch }}
          path: workbuddy2api-panel_${VERSION}_${{ matrix.arch }}.deb

